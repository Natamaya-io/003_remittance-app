services:
  app:
    container_name: remitgo-app
    build:
      context: .
      dockerfile: Containerfile
    image: remitgo:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - remitgo-db:/var/lib/mysql:Z
      - remitgo-uploads:/var/www/html/public/uploads:Z
      - remitgo-storage:/var/www/html/storage:Z

volumes:
  remitgo-db:
    name: remitgo-db
  remitgo-uploads:
    name: remitgo-uploads
  remitgo-storage:
    name: remitgo-storage
